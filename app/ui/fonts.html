<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office字体管理</title><link rel="stylesheet" href="/app/FnOffice/style.css"><link rel="stylesheet" href="/app/FnOffice/fonts.css?v=0.6.1.2.pre.9"></head>
<body><main><h1>Office字体管理</h1><p class="hint">选择字体后先进行批量操作，最后点击右下角“保存并生效”。</p><button id="addFonts" type="button">添加字体</button>
<div class="font-columns"><section><h2>已启用字体</h2><input id="enabledFilter" placeholder="筛选已启用字体"><div><button id="enabledAll" type="button">全选</button> <button id="enabledDisable" type="button">批量停用</button> <button id="enabledDelete" type="button">批量删除</button></div><div id="enabled">读取中…</div></section><section><h2>已停用字体</h2><input id="disabledFilter" placeholder="筛选已停用字体"><div><button id="disabledAll" type="button">全选</button> <button id="disabledEnable" type="button">批量启用</button> <button id="disabledDelete" type="button">批量删除</button></div><div id="disabled">读取中…</div></section></div>
<dialog id="addDialog"><form method="dialog"><h2>添加字体</h2><p class="hint">可多选字体文件或选择整个文件夹，确认后会加入待上传列表。</p><input id="fontFiles" type="file" accept=".ttf,.otf,.ttc,.woff,.woff2" multiple hidden><input id="fontFolder" type="file" accept=".ttf,.otf,.ttc,.woff,.woff2" multiple webkitdirectory directory hidden><button id="chooseFiles" type="button">上传文件</button> <button id="chooseFolder" type="button">上传文件夹</button><div id="pendingFiles" class="pending-files"></div><div class="dialog-actions"><button value="cancel" type="submit">关闭</button></div></form></dialog>
<dialog id="conflictDialog"><form method="dialog"><h2>发现冲突字体</h2><p>以下字体文件已存在，请选择覆盖或跳过：</p><div id="conflictFiles" class="pending-files"></div><div class="dialog-actions"><button id="conflictOverwrite" type="button">覆盖</button><button id="conflictSkip" type="button">跳过</button><button value="cancel" type="submit">取消</button></div></form></dialog>
<progress id="saveProgress" max="100" value="0" class="save-progress"></progress><button id="saveAll" type="button" class="save-fonts">保存并生效</button><span id="status" class="font-status"></span></main><script src="/app/FnOffice/fonts.js?v=0.6.1.2.pre.9"></script></body></html>
