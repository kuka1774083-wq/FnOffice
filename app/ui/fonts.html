<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office字体管理</title><link rel="stylesheet" href="/app/FnOffice/style.css"></head><body><main><h1>Office字体管理</h1><p class="hint">上传的字体会持久保存在 OnlyOffice 数据目录。可按住 Ctrl/Shift 多选字体，也可选择整个文件夹。启用或停用字体后将自动刷新字体缓存并重启 OnlyOffice。</p><section><h2>上传字体</h2><input id="fontFile" type="file" accept=".ttf,.otf,.ttc,.woff,.woff2" multiple webkitdirectory directory><button id="upload" type="button">上传并启用</button><span id="status"></span></section><section><h2>已启用字体</h2><div id="enabled">读取中…</div></section><section><h2>已停用字体</h2><div id="disabled">读取中…</div></section></main><script src="/app/FnOffice/fonts.js?v=0.6.1.0"></script></body></html>
