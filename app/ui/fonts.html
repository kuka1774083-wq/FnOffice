<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office字体管理</title><link rel="stylesheet" href="/app/FnOffice/style.css"></head><body><main><h1>Office字体管理</h1><p class="hint">选择字体后先进行批量操作，最后点击右下角“保存并生效”；新增字体也会在此时统一写入并重启 OnlyOffice。</p><section><h2>添加字体</h2><input id="fontFile" type="file" accept=".ttf,.otf,.ttc,.woff,.woff2" multiple webkitdirectory directory><span id="pendingFiles"></span></section><section><h2>已启用字体</h2><input id="enabledFilter" placeholder="筛选已启用字体"><div><button id="enabledAll" type="button">全选</button> <button id="enabledDisable" type="button">批量停用</button> <button id="enabledDelete" type="button">批量删除</button></div><div id="enabled">读取中…</div></section><section><h2>已停用字体</h2><input id="disabledFilter" placeholder="筛选已停用字体"><div><button id="disabledAll" type="button">全选</button> <button id="disabledEnable" type="button">批量启用</button> <button id="disabledDelete" type="button">批量删除</button></div><div id="disabled">读取中…</div></section><button id="saveAll" type="button" style="position:fixed;right:24px;bottom:24px;z-index:10">保存并生效</button><span id="status"></span></main><script src="/app/FnOffice/fonts.js?v=0.6.1.0"></script></body></html>
