<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office字体管理</title><link rel="stylesheet" href="/app/FnOffice/style.css"></head>
<body><main><h1>Office字体管理</h1><p class="hint">所有变更会暂存，完成后点击右下角“保存并生效”。</p>
<section><h2>添加字体</h2><div><input id="fontFiles" type="file" accept=".ttf,.otf,.ttc,.woff,.woff2" multiple><button id="chooseFiles" type="button">上传文件</button><input id="fontFolder" type="file" accept=".ttf,.otf,.ttc,.woff,.woff2" multiple webkitdirectory directory hidden><button id="chooseFolder" type="button">上传文件夹</button></div><div id="pendingFiles"></div></section>
<section><h2>已启用字体</h2><input id="enabledFilter" placeholder="筛选已启用字体"><div><button id="enabledAll" type="button">全选</button> <button id="enabledDisable" type="button">批量停用</button> <button id="enabledDelete" type="button">批量删除</button></div><div id="enabled">读取中…</div></section>
<section><h2>已停用字体</h2><input id="disabledFilter" placeholder="筛选已停用字体"><div><button id="disabledAll" type="button">全选</button> <button id="disabledEnable" type="button">批量启用</button> <button id="disabledDelete" type="button">批量删除</button></div><div id="disabled">读取中…</div></section>
<progress id="saveProgress" max="100" value="0" style="display:none;position:fixed;right:24px;bottom:72px;width:240px;z-index:10"></progress><button id="saveAll" type="button" style="position:fixed;right:24px;bottom:24px;z-index:10">保存并生效</button><span id="status"></span></main><script src="/app/FnOffice/fonts.js?v=0.6.1.2-pre1"></script></body></html>
