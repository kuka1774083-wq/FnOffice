<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office分享</title><link rel="stylesheet" href="/app/FnOffice/style.css"></head><body><main class="shares-page"><header class="shares-header"><div><h1>Office分享</h1><p class="hint">仅显示您创建的分享链接。</p></div><button id="adminToggle" type="button" hidden>管理全部分享</button></header><section class="share-filters"><input id="query" placeholder="按文件名或路径筛选"><input id="from" type="date" title="开始日期"><input id="to" type="date" title="结束日期"><input id="owner" placeholder="按所有者筛选" hidden><select id="status"><option value="all">全部状态</option><option value="readonly">只读</option><option value="download">可下载</option><option value="editable">可编辑</option><option value="revoked">已撤回</option></select><label class="child-filter"><input id="children" type="checkbox">包含子文件夹</label><button id="refresh" type="button">刷新</button></section><div class="share-table-wrap"><table><thead><tr><th>文件名</th><th>路径</th><th class="owner-col" hidden>所有者</th><th>大小</th><th>专属链接</th><th>分享创建日期</th><th class="actions-col">操作</th></tr></thead><tbody id="rows"><tr><td colspan="7">正在读取…</td></tr></tbody></table></div><p id="status" class="status"></p></main><script type="module" src="/app/FnOffice/shares.js?v=0.4.78-pre"></script></body></html>
