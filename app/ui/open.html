<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office</title><link rel="stylesheet" href="/app/FnOffice/style.css"></head><body class="editor-body"><div id="editor-shell"><div id="editor-toolbar"><button id="downloadFile" class="editor-toolbar-button" type="button">⇩ 下载此文件</button><button id="shareFile" class="editor-toolbar-button" type="button">↗ 对外分享</button><button id="openStandalone" class="editor-open-standalone" type="button" title="在独立网页中打开">↗ 在新窗口打开</button></div><div id="placeholder"></div><div id="message" class="editor-message">正在打开文档…</div><button id="authorize" class="editor-authorize" hidden>授权并打开</button></div><dialog id="shareDialog" class="share-dialog"><form method="dialog"><div class="share-dialog-header"><h2>分享权限管理</h2><button class="share-close" value="cancel" aria-label="关闭">×</button></div><p class="share-dialog-hint">此链接可免登录访问。撤回后立即失效；再次启用时可选择复用原链接。</p><label class="share-option share-required"><input id="shareRead" type="checkbox" checked disabled><span>允许查看（必选）</span></label><label class="share-option"><input id="shareDownload" type="checkbox"><span>允许下载</span></label><label class="share-option"><input id="shareWrite" type="checkbox"><span>允许编辑</span></label><label class="share-link-label" for="shareUrl">此文件的专用链接</label><div class="share-link-row"><textarea id="shareUrl" rows="3" readonly spellcheck="false"></textarea><button id="copyShareUrl" class="editor-toolbar-button" type="button">复制链接</button></div><p id="shareStatus" class="share-status" role="status"></p><div class="share-dialog-actions"><button id="revokeShare" class="share-revoke" type="button">撤回链接</button><button id="saveShare" class="editor-toolbar-button" type="button">保存权限</button></div></form></dialog><dialog id="shareChoice" class="share-dialog share-choice"><form method="dialog"><h2>已有分享链接</h2><p class="share-dialog-hint">此文件曾创建过分享链接。请选择本次使用方式。</p><div class="share-choice-actions"><button id="reuseShare" class="editor-toolbar-button" value="reuse" type="button">使用上一次链接</button><button id="newShare" class="editor-toolbar-button" value="new" type="button">生成新链接</button><button value="cancel" type="submit">取消</button></div></form></dialog><script type="module" src="/app/FnOffice/open.js?v=0.4.78-pre"></script></body></html>
